<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste 3D - img2threejs</title>
    <link rel="stylesheet" href="style.css">

    <!-- Import Maps para Three.js via CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.2/index.js",
            "gsap/": "https://cdn.jsdelivr.net/npm/gsap@3.12.2/"
        }
    }
    </script>

    <!-- Tipografia Cartoon -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .test-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .test-header h1 {
            font-family: 'Bangers', cursive;
            font-size: 3rem;
            color: var(--foreground);
            margin-bottom: 0.5rem;
        }
        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        .comic-btn {
            padding: 0.75rem 1.5rem;
            font-family: 'Bangers', cursive;
            font-size: 1.2rem;
            border: 4px solid #111;
            border-radius: 8px;
            cursor: pointer;
            background: var(--card);
            color: var(--foreground);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .comic-btn:hover { transform: translateY(-2px); box-shadow: 6px 6px 0 #111; }
        .comic-btn:active { transform: translateY(2px); box-shadow: 2px 2px 0 #111; }
        .btn-primary { background: #FFD700; color: #111; }
        .btn-secondary { background: #2D7DD2; color: #fff; }
        .btn-danger { background: #FF2D87; color: #fff; }
        .btn-algo { background: #00C9A7; color: #111; font-size: 1rem; padding: 0.5rem 1rem; }
        .canvas-wrapper {
            width: 100%;
            height: 600px;
            border: 4px solid #111;
            border-radius: 12px;
            overflow: hidden;
            background: #0a0a0a;
            position: relative;
        }
        #three-canvas { width: 100%; height: 100%; display: block; }
        .model-info {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: 'Nunito', sans-serif;
        }
        .model-info h3 { margin: 0 0 0.5rem; font-family: 'Bangers', cursive; }
        .model-info pre { white-space: pre-wrap; font-size: 0.85rem; max-height: 200px; overflow: auto; }
        .file-input { display: none; }
        .drop-zone {
            border: 3px dashed var(--border);
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.1);
        }
        .drop-zone p { margin: 0; font-family: 'Nunito', sans-serif; color: var(--muted-foreground); }
        .preset-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1rem; }
        .preset-btn { padding: 0.5rem 1rem; font-family: 'Nunito', sans-serif; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="test-container">
    <div class="test-header">
        <h1>TESTE 3D — img2threejs</h1>
        <p style="color: var(--muted-foreground); font-family: 'Nunito', sans-serif;">
            Carregue modelos Three.js gerados pelo img2threejs ou teste presets
        </p>
    </div>

    <div class="preset-buttons">
        <button class="comic-btn btn-primary preset-btn" data-preset="cube">Cubo Simples</button>
        <button class="comic-btn btn-secondary preset-btn" data-preset="rubik">Cubo de Rubik (Teste)</button>
        <button class="comic-btn btn-danger preset-btn" data-preset="rubik-main">Cubo Principal (index.html)</button>
        <button class="comic-btn preset-btn" style="background:#00C9A7;color:#111;" data-preset="sphere">Esfera</button>
    </div>

    <div class="drop-zone" id="dropZone">
        <p>Arraste um arquivo .js (modelo Three.js) aqui ou clique para selecionar</p>
        <input type="file" class="file-input" id="fileInput" accept=".js,.json">
    </div>

    <div class="controls">
        <button class="comic-btn btn-primary" id="btnWireframe">WIREFRAME</button>
        <button class="comic-btn btn-secondary" id="btnRotate">AUTO-ROTATE</button>
        <button class="comic-btn btn-danger" id="btnClear">LIMPAR</button>
    </div>

    <!-- Controles do Cubo de Rubik (aparecem quando carrega rubik-main) -->
    <div class="rubik-controls" id="rubikControls" style="display: none; margin-top: 1rem;">
        <div class="controls" style="margin-bottom: 0.5rem;">
            <button class="comic-btn btn-primary" id="btnScramble">EMBARALHAR (S)</button>
            <button class="comic-btn btn-secondary" id="btnSolve">RESOLVER (R)</button>
            <button class="comic-btn btn-algo" id="btnToggleDrag" style="background:#FF6B35;color:#111;">MODO DRAG: ON</button>
        </div>
        <div class="controls" style="margin-bottom: 0.5rem;">
            <button class="comic-btn btn-algo" data-algo="R U R' U'">SEXY MOVE</button>
            <button class="comic-btn btn-algo" data-algo="R U R' U' R' F R2 U' R' U' R U R' F'">T-PERM</button>
            <button class="comic-btn btn-algo" data-algo="R U R' F' R U R' U' R' F R2 U' R' U'">J-PERM</button>
        </div>
        <div class="controls">
            <button class="comic-btn btn-algo" data-algo="F R U R' U' F'">OLL 1</button>
            <button class="comic-btn btn-algo" data-algo="R U2 R' U' R U' R'">OLL 2</button>
            <button class="comic-btn btn-algo" data-algo="M2 U M2 U2 M2 U M2">H-PERM</button>
        </div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="three-canvas"></canvas>
    </div>

    <div class="model-info" id="modelInfo" style="display: none;">
        <h3>INFO DO MODELO</h3>
        <pre id="modelDetails">Nenhum modelo carregado</pre>
    </div>
</div>

<script type="module">
import * as THREE from 'three';
import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
import gsap from 'gsap';

// ===== CONFIGURAÇÃO THREE.JS =====
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(canvas.clientWidth, canvas.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
camera.position.set(3, 3, 5);

const controls = new TrackballControls(camera, renderer.domElement);
controls.mouseButtons = {
    LEFT: THREE.MOUSE.PAN,
    MIDDLE: THREE.MOUSE.ZOOM,
    RIGHT: THREE.MOUSE.ROTATE
};
controls.rotateSpeed = 4.0;
controls.noPan = false;
controls.noZoom = false;
controls.staticMoving = false;
controls.dynamicDampingFactor = 0.08;

renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
controls.minDistance = 2;
controls.maxDistance = 50;

let currentModel = null;
let autoRotate = false;
let dragMode = true; // Modo drag ativado por padrão
let cubes = []; // array de cubies (apenas para rubik-main)
let isAnimating = false;
const moveQueue = [];
const moveHistory = [];
const activePivot = new THREE.Group();
scene.add(activePivot);

// Dicionário de notações
const notationMap = {
    "U":  { axis: 'y', target: 1,  direction: -1 },
    "U'": { axis: 'y', target: 1,  direction: 1 },
    "D":  { axis: 'y', target: -1, direction: 1 },
    "D'": { axis: 'y', target: -1, direction: -1 },
    "L":  { axis: 'x', target: -1, direction: 1 },
    "L'": { axis: 'x', target: -1, direction: -1 },
    "R":  { axis: 'x', target: 1,  direction: -1 },
    "R'": { axis: 'x', target: 1,  direction: 1 },
    "F":  { axis: 'z', target: 1,  direction: -1 },
    "F'": { axis: 'z', target: 1,  direction: 1 },
    "B":  { axis: 'z', target: -1, direction: 1 },
    "B'": { axis: 'z', target: -1, direction: -1 },
    // Camadas do meio
    "M":  { axis: 'x', target: 0,  direction: 1 },
    "M'": { axis: 'x', target: 0,  direction: -1 },
    "E":  { axis: 'y', target: 0,  direction: 1 },
    "E'": { axis: 'y', target: 0,  direction: -1 },
    "S":  { axis: 'z', target: 0,  direction: -1 },
    "S'": { axis: 'z', target: 0,  direction: 1 }
};

function invertNotation(note) {
    return note.includes("'") ? note.replace("'", "") : note + "'";
}

function getNotationFromRaw(axis, target, direction) {
    const roundedTarget = Math.round(target);
    for (const [note, data] of Object.entries(notationMap)) {
        if (data.axis === axis && data.target === roundedTarget && data.direction === direction) {
            return note;
        }
    }
    return null;
}

function executeNextMove() {
    if (isAnimating || moveQueue.length === 0 || cubes.length === 0) return;

    isAnimating = true;
    const move = moveQueue.shift();

    const slicePieces = cubes.filter(c => Math.abs(c.position[move.axis] - move.target) < 0.1);

    if (slicePieces.length === 0) {
        isAnimating = false;
        executeNextMove();
        return;
    }

    activePivot.rotation.set(0, 0, 0);
    slicePieces.forEach(c => activePivot.attach(c));

    const angle = -(Math.PI / 2) * move.direction;

    gsap.to(activePivot.rotation, {
        [move.axis]: angle,
        duration: move.duration || 0.35,
        ease: "back.out(1.7)",
        onComplete: () => {
            activePivot.updateMatrixWorld();
            slicePieces.forEach(c => {
                if (currentModel && currentModel.mesh) {
                    currentModel.mesh.attach(c);
                }
                c.position.x = Math.round(c.position.x);
                c.position.y = Math.round(c.position.y);
                c.position.z = Math.round(c.position.z);

                const euler = new THREE.Euler().setFromQuaternion(c.quaternion);
                euler.x = Math.round(euler.x / (Math.PI/2)) * (Math.PI/2);
                euler.y = Math.round(euler.y / (Math.PI/2)) * (Math.PI/2);
                euler.z = Math.round(euler.z / (Math.PI/2)) * (Math.PI/2);
                c.quaternion.setFromEuler(euler);
            });

            isAnimating = false;
            executeNextMove();
        }
    });
}

function enqueueMoveRaw(axis, target, direction, duration = 0.35, isSolvingAction = false) {
    moveQueue.push({ axis, target, direction, duration, isSolvingAction });

    if (!isSolvingAction) {
        const note = getNotationFromRaw(axis, target, direction);
        if (note) moveHistory.push(note);
    }

    executeNextMove();
}

function enqueueNotation(notation, duration = 0.35, isSolvingAction = false) {
    const data = notationMap[notation];
    if (data) {
        enqueueMoveRaw(data.axis, data.target, data.direction, duration, isSolvingAction);
    }
}

// ===== LUZES =====
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
fillLight.position.set(-5, 5, -5);
scene.add(fillLight);

// ===== CHÃO =====
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 20),
    new THREE.ShadowMaterial({ opacity: 0.2 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.5;
ground.receiveShadow = true;
scene.add(ground);

// ===== PRESETS =====
const presets = {
    cube: () => {
        const geo = new THREE.BoxGeometry(1, 1, 1);
        const mat = new THREE.MeshStandardMaterial({
            color: 0xFFD700,
            metalness: 0.3,
            roughness: 0.4
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        return { mesh, info: "Cubo simples 1x1x1 com MeshStandardMaterial dourado" };
    },
    sphere: () => {
        const geo = new THREE.SphereGeometry(1, 32, 32);
        const mat = new THREE.MeshStandardMaterial({
            color: 0x2D7DD2,
            metalness: 0.2,
            roughness: 0.5
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        return { mesh, info: "Esfera com 32 segmentos, material azul" };
    },
    rubik: () => {
        const group = new THREE.Group();
        const colors = {
            U: 0xffffff, D: 0xffd700, F: 0xff0000,
            B: 0xff8800, L: 0x00ff00, R: 0x0000ff
        };
        const size = 0.3;
        const gap = 0.02;
        const step = size + gap;

        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    if (x === 0 && y === 0 && z === 0) continue;

                    const geo = new THREE.BoxGeometry(size, size, size);
                    const mats = [
                        new THREE.MeshStandardMaterial({ color: x === 1 ? colors.R : x === -1 ? colors.L : 0x111111, roughness: 0.3 }),
                        new THREE.MeshStandardMaterial({ color: x === 1 ? colors.R : x === -1 ? colors.L : 0x111111, roughness: 0.3 }),
                        new THREE.MeshStandardMaterial({ color: y === 1 ? colors.U : y === -1 ? colors.D : 0x111111, roughness: 0.3 }),
                        new THREE.MeshStandardMaterial({ color: y === 1 ? colors.U : y === -1 ? colors.D : 0x111111, roughness: 0.3 }),
                        new THREE.MeshStandardMaterial({ color: z === 1 ? colors.F : z === -1 ? colors.B : 0x111111, roughness: 0.3 }),
                        new THREE.MeshStandardMaterial({ color: z === 1 ? colors.F : z === -1 ? colors.B : 0x111111, roughness: 0.3 })
                    ];
                    const cube = new THREE.Mesh(geo, mats);
                    cube.position.set(x * step, y * step, z * step);
                    cube.castShadow = true;
                    group.add(cube);
                }
            }
        }
        return { mesh: group, info: "Cubo de Rubik 3x3x3 procedural (26 cubinhos)" };
    },
    "rubik-main": () => {
        const group = new THREE.Group();

        const cubeColors = {
            U: 0xFFFFFF, D: 0xFFD500, F: 0x00FF00,
            B: 0x0000FF, L: 0xFF8800, R: 0xFF0000
        };
        const cubeSize = 0.88;
        const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);

        const outlineSize = 0.98;
        const outlineGeometry = new THREE.BoxGeometry(outlineSize, outlineSize, outlineSize);
        const outlineMaterial = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.BackSide });

        function createCartoonMaterial(colorHex) {
            if (colorHex === 0x0A0A0A) {
                return new THREE.MeshBasicMaterial({ color: colorHex });
            }

            return new THREE.ShaderMaterial({
                uniforms: {
                    baseColor: { value: new THREE.Color(colorHex) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 baseColor;
                    varying vec2 vUv;
                    void main() {
                        vec2 centered = vUv - 0.5;
                        float c = 0.7071;
                        float s = 0.7071;
                        vec2 ruv = vec2(centered.x * c - centered.y * s, centered.x * s + centered.y * c);
                        vec2 grid = fract(ruv * 22.0);
                        float dist = distance(grid, vec2(0.5));
                        float dot = 1.0 - smoothstep(0.15, 0.25, dist);
                        vec3 finalColor = mix(baseColor, vec3(0.0), dot * 0.4);
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `
            });
        }

        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const baseColor = 0x0A0A0A;
                    const materials = [
                        createCartoonMaterial(x === 1 ? cubeColors.R : baseColor),
                        createCartoonMaterial(x === -1 ? cubeColors.L : baseColor),
                        createCartoonMaterial(y === 1 ? cubeColors.U : baseColor),
                        createCartoonMaterial(y === -1 ? cubeColors.D : baseColor),
                        createCartoonMaterial(z === 1 ? cubeColors.F : baseColor),
                        createCartoonMaterial(z === -1 ? cubeColors.B : baseColor)
                    ];
                    const cubie = new THREE.Mesh(geometry, materials);
                    cubie.position.set(x, y, z);

                    const outline = new THREE.Mesh(outlineGeometry, outlineMaterial);
                    cubie.add(outline);

                    cubie.userData = { id: `${x},${y},${z}` };
                    group.add(cubie);
                    cubes.push(cubie);
                }
            }
        }
        return { mesh: group, info: "Cubo de Rubik estilo index.html — shader halftone + bordas Inverted Hull (27 cubies)" };
    }
};

// ===== FUNÇÕES =====
function loadModel(modelData) {
    if (currentModel) {
        scene.remove(currentModel.mesh);
        if (currentModel.mesh.geometry) currentModel.mesh.geometry.dispose();
        if (currentModel.mesh.material) {
            if (Array.isArray(currentModel.mesh.material)) {
                currentModel.mesh.material.forEach(m => m.dispose());
            } else {
                currentModel.mesh.material.dispose();
            }
        }
    }

    currentModel = modelData;
    scene.add(currentModel.mesh);

    const box = new THREE.Box3().setFromObject(currentModel.mesh);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);

    currentModel.mesh.position.sub(center);
    camera.position.set(maxDim * 2, maxDim * 1.5, maxDim * 2.5);
    controls.target.set(0, 0, 0);
    controls.update();

    ground.position.y = box.min.y - 0.1;

    document.getElementById('modelInfo').style.display = 'block';
    document.getElementById('modelDetails').textContent = modelData.info;

    // Mostrar/esconder controles do Rubik
    const rubikControls = document.getElementById('rubikControls');
    if (modelData.info && modelData.info.includes('index.html')) {
        rubikControls.style.display = 'block';
    } else {
        rubikControls.style.display = 'none';
    }
}

function loadPreset(name) {
    if (presets[name]) {
        // Resetar variáveis do Rubik ANTES de criar o preset
        cubes = [];
        moveQueue.length = 0;
        moveHistory.length = 0;
        isAnimating = false;
        activePivot.rotation.set(0, 0, 0);
        loadModel(presets[name]());
    }
}

async function loadFile(file) {
    // Resetar variáveis do Rubik antes de carregar novo modelo
    cubes = [];
    moveQueue.length = 0;
    moveHistory.length = 0;
    isAnimating = false;
    activePivot.rotation.set(0, 0, 0);

    try {
        const text = await file.text();
        const module = await importModuleFromString(text);
        if (module && module.default) {
            const model = module.default();
            if (model && model.mesh) {
                loadModel(model);
            } else if (model instanceof THREE.Object3D) {
                loadModel({ mesh: model, info: `Modelo carregado de ${file.name}` });
            }
        }
    } catch (err) {
        console.error('Erro ao carregar modelo:', err);
        alert('Erro ao carregar o arquivo: ' + err.message);
    }
}

function importModuleFromString(code) {
    const blob = new Blob([code], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    return import(url).finally(() => URL.revokeObjectURL(url));
}

// ===== EVENTOS =====
document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => loadPreset(btn.dataset.preset));
});

document.getElementById('btnWireframe').addEventListener('click', () => {
    if (currentModel) {
        currentModel.mesh.traverse(obj => {
            if (obj.isMesh) obj.material.wireframe = !obj.material.wireframe;
        });
    }
});

document.getElementById('btnRotate').addEventListener('click', (btn) => {
    autoRotate = !autoRotate;
    btn.textContent = autoRotate ? 'PARAR ROTAÇÃO' : 'AUTO-ROTATE';
    btn.classList.toggle('btn-danger', autoRotate);
    btn.classList.toggle('btn-secondary', !autoRotate);
});

document.getElementById('btnClear').addEventListener('click', () => {
    if (currentModel) {
        scene.remove(currentModel.mesh);
        currentModel = null;
        document.getElementById('modelInfo').style.display = 'none';
        document.getElementById('rubikControls').style.display = 'none';
    }
});

// Botões do Cubo de Rubik
document.getElementById('btnScramble').addEventListener('click', scrambleCube);
document.getElementById('btnSolve').addEventListener('click', solveCube);

// Toggle do modo drag
document.getElementById('btnToggleDrag').addEventListener('click', function() {
    dragMode = !dragMode;
    this.textContent = dragMode ? 'MODO DRAG: ON' : 'MODO DRAG: OFF';
    this.style.background = dragMode ? '#FF6B35' : '#666';
    this.style.color = dragMode ? '#111' : '#999';
    console.log('Drag mode:', dragMode);
});

document.querySelectorAll('.btn-algo').forEach(btn => {
    // Pular o botão de toggle (não tem data-algo)
    if (!btn.hasAttribute('data-algo')) return;
    
    btn.addEventListener('click', () => {
        const algo = btn.getAttribute('data-algo');
        const moves = algo.split(' ');
        moves.forEach(note => {
            if (note.includes('2')) {
                const baseNote = note.replace('2', '');
                enqueueNotation(baseNote, 0.1);
                enqueueNotation(baseNote, 0.1);
            } else {
                enqueueNotation(note, 0.1);
            }
        });
    });
});

function scrambleCube() {
    console.log('scrambleCube called, cubes.length:', cubes.length);
    if (cubes.length === 0) return;
    const notationsList = Object.keys(notationMap);
    for (let i = 0; i < 20; i++) {
        const randomNote = notationsList[Math.floor(Math.random() * notationsList.length)];
        enqueueNotation(randomNote, 0.05);
    }
}

function solveCube() {
    console.log('solveCube called, moveHistory.length:', moveHistory.length);
    if (moveHistory.length === 0) return;
    const reverseMoves = [...moveHistory].reverse().map(invertNotation);
    reverseMoves.forEach(note => {
        enqueueNotation(note, 0.08, true);
    });
    moveHistory.length = 0;
}

// Atalhos de teclado
window.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 's') scrambleCube();
    if (e.key.toLowerCase() === 'r') solveCube();
});

// ===== DRAG INTERACTION (RAYCAST) =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let dragStartPoint = null;
let dragIntersectNormal = null;
let clickedCubie = null;
const dragPlane = new THREE.Plane();
const dragPlaneIntersect = new THREE.Vector3();

canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || cubes.length === 0 || !dragMode) return;

    const rect = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(cubes, false);
    console.log('pointerdown - intersects:', intersects.length, 'cubes:', cubes.length);
    const hit = (intersects.length > 0 && intersects[0].face) ? intersects[0] : null;

    if (hit) {
        console.log('HIT:', hit.object.userData, 'face:', hit.face);
        controls.enabled = false;
        clickedCubie = hit.object;
        dragIntersectNormal = hit.face.normal.clone().transformDirection(clickedCubie.matrixWorld).round();
        dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()), hit.point);
        dragStartPoint = hit.point.clone();
    } else {
        console.log('NO HIT - dragMode:', dragMode, 'cubes.length:', cubes.length);
    }
});

canvas.addEventListener('pointermove', (e) => {
    if (!dragStartPoint || cubes.length === 0) return;

    const rect = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const didIntersect = raycaster.ray.intersectPlane(dragPlane, dragPlaneIntersect);
    if (!didIntersect) return;

    const dragVector = new THREE.Vector3().subVectors(dragPlaneIntersect, dragStartPoint);
    console.log('pointermove - dragVector.length:', dragVector.length);

    if (dragVector.length() > 0.5) {
        console.log('THRESHOLD REACHED - enqueueing move');
        let axis = new THREE.Vector3();
        if (Math.abs(dragIntersectNormal.x) > 0.5) dragVector.x = 0;
        if (Math.abs(dragIntersectNormal.y) > 0.5) dragVector.y = 0;
        if (Math.abs(dragIntersectNormal.z) > 0.5) dragVector.z = 0;

        let absX = Math.abs(dragVector.x);
        let absY = Math.abs(dragVector.y);
        let absZ = Math.abs(dragVector.z);
        let maxDrag = Math.max(absX, absY, absZ);

        let sliceTarget = 0;
        let rotationAxis = 'x';
        let direction = 1;

        if (Math.abs(dragIntersectNormal.z) > 0.5) {
            if (maxDrag === absX) { rotationAxis = 'y'; sliceTarget = clickedCubie.position.y; direction = Math.sign(dragVector.x) * Math.sign(dragIntersectNormal.z) * -1; }
            else { rotationAxis = 'x'; sliceTarget = clickedCubie.position.x; direction = Math.sign(dragVector.y) * Math.sign(dragIntersectNormal.z); }
        } else if (Math.abs(dragIntersectNormal.x) > 0.5) {
            if (maxDrag === absZ) { rotationAxis = 'y'; sliceTarget = clickedCubie.position.y; direction = Math.sign(dragVector.z) * Math.sign(dragIntersectNormal.x); }
            else { rotationAxis = 'z'; sliceTarget = clickedCubie.position.z; direction = Math.sign(dragVector.y) * Math.sign(dragIntersectNormal.x) * -1; }
        } else {
            if (maxDrag === absX) { rotationAxis = 'z'; sliceTarget = clickedCubie.position.z; direction = Math.sign(dragVector.x) * Math.sign(dragIntersectNormal.y); }
            else { rotationAxis = 'x'; sliceTarget = clickedCubie.position.x; direction = Math.sign(dragVector.z) * Math.sign(dragIntersectNormal.y) * -1; }
        }

        enqueueMoveRaw(rotationAxis, sliceTarget, direction);
        dragStartPoint = null;
    }
});

canvas.addEventListener('pointerup', () => {
    console.log('pointerup');
    controls.enabled = true;
    dragStartPoint = null;
    clickedCubie = null;
    dragIntersectNormal = null;
});

// Drag & Drop
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) loadFile(e.target.files[0]);
});

// Resize
window.addEventListener('resize', () => {
    camera.aspect = canvas.clientWidth / canvas.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    controls.handleResize();
});

// Loop de animação
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    if (autoRotate && currentModel) {
        currentModel.mesh.rotation.y += 0.005;
    }
    renderer.render(scene, camera);
}
animate();

// Carregar preset inicial
loadPreset('cube');
</script>
